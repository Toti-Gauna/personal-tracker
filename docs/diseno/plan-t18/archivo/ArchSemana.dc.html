<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Semana</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="{{ vars }} width: 390px; min-height: 1380px; box-sizing: border-box; background-color: var(--paper); background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 18px 18px; color: var(--ink); font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column">
  <main style="flex: 1; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 22px">

    <header style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px"><h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 125%; font-size: 34px; font-weight: 900; letter-spacing: -0.045em; line-height: 1">Metas</h1></div>
      <p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--sub)">Semana 1 de El despegue: vas 47 %. Lo que más falta es Eclipse y Handyx.</p>
    </header>
    <div role="tablist" aria-label="Horizonte" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line)">
      <a href="Ruta.dc.html" role="tab" aria-selected="false" style="min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; color: var(--sub)">Ruta</a>
      <a href="Semana.dc.html" role="tab" aria-selected="true" style="min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; border-bottom: 2px solid var(--ink); margin-bottom: -1px; color: var(--ink); font-weight: 600">Semana</a>
      <a href="MetasMes.dc.html" role="tab" aria-selected="false" style="min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; color: var(--sub)">Mes</a>
      <a href="Metas.dc.html" role="tab" aria-selected="false" style="min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; color: var(--sub)">Bim.</a>
      <a href="MetasAnio.dc.html" role="tab" aria-selected="false" style="min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; color: var(--sub)">Año</a>
    </div>

    <header style="display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sub)">9 – 15 nov · semana 1</span>
        <h2 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 125%; font-size: 26px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.95">La primera</h2>
      </div>
      <b style="font-family: 'Geist Mono', monospace; font-size: 34px; font-weight: 500; letter-spacing: -0.04em">47%</b>
    </header>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line)" aria-label="Resultado por día">
      <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); height: 92px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 0 0">
          <span style="{{ d.lb }}">{{ d.name }}</span>
          <div style="display: flex; flex-direction: column; justify-content: flex-end; height: 56px"><div style="{{ d.fill }}"></div></div>
        </div>
      </sc-for>
    </div>

    <sc-for list="{{ areas }}" as="a" hint-placeholder-count="4">
      <section style="display: flex; flex-direction: column">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--ink)">
          <span style="{{ a.title }}">{{ a.name }}</span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: var(--sub)">{{ a.goal }}</span>
        </div>
        <sc-for list="{{ a.items }}" as="i" hint-placeholder-count="3">
          <div style="display: grid; grid-template-columns: 1fr auto 40px; gap: 10px; align-items: center; min-height: 56px; border-bottom: 1px solid var(--line)">
            <span style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 14.5px">{{ i.text }}</span><span style="height: 3px; background: var(--line)"><span style="{{ i.bar }}"></span></span></span>
            <span style="font-family: 'Geist Mono', monospace; font-size: 13px">{{ i.val }}</span>
            <button aria-label="Sumar uno" style="width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 18px">+</button>
          </div>
        </sc-for>
      </section>
    </sc-for>

    <a href="NuevaMeta.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px dashed var(--sub); border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14.5px">+ Nueva meta</a>
  </main>

  <nav aria-label="Secciones" style="border-top: 1px solid var(--line); background: var(--paper); display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 14px">
    <sc-if value="{{ nav.mini }}" hint-placeholder-val="{{ false }}">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 54px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: linear-gradient(var(--fx), var(--fx)) 0 100% / 24% 2px no-repeat">
        <a href="Foco.dc.html" style="display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; color: var(--ink); text-decoration: none">
          <span style="width: 8px; height: 8px; background: var(--fx)"></span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Programación en foco</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--sub)">50/10 + 30 · 1 de 2</span></span>
          <b style="font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: -0.05em">38:12</b>
        </a>
        <button aria-label="Pausar" style="border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--ink); display: grid; place-items: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      </div>
    </sc-if>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
      <sc-for list="{{ nav.items }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" aria-current="{{ n.cur }}" style="{{ n.st }}">
          <span style="{{ n.pill }}"><span style="{{ n.ico }}"></span></span>
          <span>{{ n.label }}</span>
          <sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 4px; left: calc(50% + 9px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: var(--ink); color: var(--paper); font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 600; display: grid; place-items: center">{{ n.badge }}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1380}}'>
class Component extends DCLogic {
  renderVals() {
    const T = { dark: { paper: '#0E0F10', ink: '#EDEDE8', sub: '#9A9D98', line: '#2C2E2D', dot: 'rgba(237,237,232,0.08)', ing: '#6CC4EE', hx: '#B3A4FF', ec: '#FF9F62', sa: '#7FD69A', ru: '#FF8E8E', eco: '#F0D45C', a: '38%' }, light: { paper: '#F2F3EF', ink: '#141515', sub: '#585C59', line: '#C9CCC6', dot: 'rgba(20,21,21,0.10)', ing: '#1C7FB0', hx: '#5F4BCF', ec: '#C2560F', sa: '#24854A', ru: '#C23A3A', eco: '#8A6C00', a: '60%' } };
    const BR = { hx: '#B3A4FF', ec: '#FF9F62', sa: '#7FD69A', ru: '#FF8E8E', eco: '#F0D45C' };
    const t = T[this.props.theme] || T.dark;
    let vars = '';
    for (const k in t) if (k !== 'a') vars += '--' + k + ':' + t[k] + ';';
    for (const k in BR) vars += '--mk-' + k + ':color-mix(in srgb,' + BR[k] + ' ' + t.a + ',transparent);';
    const L = this.props.theme === 'light';
    vars += '--fx:' + (L ? '#1C7FB0' : '#6CC4EE') + ';--mk-nav:color-mix(in srgb,#F0D45C ' + (L ? '60%' : '38%') + ',transparent);';
    const ICO = { Hoy: '<path d="M3 18.5h18M7 18.5a5 5 0 0 1 10 0M12 5v3.2M5 9.6l1.9 1.3M19 9.6l-1.9 1.3"/>', Estudio: '<path d="M12 6.8c-2.2-1.6-5.2-2-8-1.6v12.9c2.8-.4 5.8 0 8 1.6 2.2-1.6 5.2-2 8-1.6V5.2c-2.8-.4-5.8 0-8 1.6zM12 6.8v12.9"/>', Metas: '<path d="M5.5 21V3.5M5.5 4.5h12.5l-2.6 4 2.6 4H5.5"/>', Entreno: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>', Perfil: '<circle cx="12" cy="9.5" r="5.5"/><path d="M9 14.6 7.6 21l4.4-2.2 4.4 2.2-1.4-6.4"/>' };
    const mask = (p) => { const u = 'url(data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>') + ')'; return 'width:22px;height:22px;background:currentColor;-webkit-mask:' + u + ' center / 22px 22px no-repeat;mask:' + u + ' center / 22px 22px no-repeat'; };
    const nav = { mini: true, items: [['Hoy','Hoy.dc.html',''],['Estudio','Estudio.dc.html','12'],['Metas','Ruta.dc.html',''],['Entreno','Rutinas.dc.html',''],['Perfil','Logros.dc.html','']].map(([label, href, badge]) => { const on = label === 'Metas'; return { label, href, badge, hasBadge: !!badge && !on, cur: on ? 'page' : 'false', ico: mask(ICO[label]),
      st: 'position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;text-decoration:none;font-size:11.5px;letter-spacing:0.01em;color:' + (on ? 'var(--ink);font-weight:600' : 'var(--sub)'),
      pill: 'width:54px;height:32px;display:grid;place-items:center;' + (on ? 'background:var(--mk-nav);clip-path:polygon(9% 0,100% 0,91% 100%,0 100%)' : '') }; }) };
    const days = [['L', 92], ['M', 61], ['X', 78], ['J', 0], ['V', 0], ['S', 0], ['D', 0]].map(([name, p], i) => ({ name: name + (p ? ' ' + p : ''),
      lb: 'font-family:Geist Mono,monospace;font-size:10.5px;text-align:center;color:' + (i === 2 ? 'var(--ink)' : 'var(--sub)'),
      fill: 'height:' + p + '%;background:' + (p >= 85 ? 'var(--eco)' : 'var(--ink)') }));
    const item = (text, done, total, area) => ({ text, val: done + '/' + total, bar: 'display:block;height:3px;background:var(--' + area + ');width:' + Math.min(100, Math.round(done / total * 100)) + '%' });
    const area = (name, k, goal, items) => ({ name, goal, items, title: 'font-family:Archivo,sans-serif;font-stretch:112%;font-weight:800;font-size:17px;width:fit-content;padding:0 3px;background:linear-gradient(98deg,transparent 2%,var(--mk-' + k + ') 2% 98%,transparent 98%) 0 75% / 100% 50% no-repeat' });
    return { vars, nav, days, areas: [
      area('Eclipse', 'ec', 'USD 3.000', [item('Ventas Foody', 2, 23, 'ec'), item('Ventas Roofy', 0, 23, 'ec'), item('Demos terminadas', 5, 12, 'ec')]),
      area('Handyx', 'hx', 'MVP', [item('Especialistas', 18, 56, 'hx'), item('Usuarios', 41, 100, 'hx')]),
      area('Salud', 'sa', 'Meta 95 kg', [item('Entrenar', 4, 7, 'sa'), item('Correr', 3, 7, 'sa'), item('Comer sano', 2, 7, 'sa')]),
      area('Trabajo nuevo', 'ru', '10 CV por día', [item('CV enviados', 30, 70, 'ru'), item('Mensajes a RRHH', 3, 7, 'ru')])
    ] };
  }
}
</script>
</body>
</html>
