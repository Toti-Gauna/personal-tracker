<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Importar JSON</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="{{ vars }} width: 390px; min-height: 1400px; box-sizing: border-box; background-color: var(--paper); background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 18px 18px; color: var(--ink); font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column">
  <main style="flex: 1; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="Hoy.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; color: var(--ink); text-decoration: none; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Hoy</a>
      <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--sub)">→ main</span>
    </div>
    <header style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 125%; font-size: 34px; font-weight: 900; letter-spacing: -0.045em; line-height: 1">Importar</h1>
      <p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--sub)">Pegás el JSON que te devuelve Claude. Trazo detecta la rama y te muestra qué cambia antes de guardar.</p>
    </header>

    <ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line)">
      <sc-for list="{{ pasos }}" as="p" hint-placeholder-count="4">
        <li style="{{ p.st }}"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--sub)">{{ p.n }}</span><span style="font-size: 12.5px; line-height: 1.3">{{ p.t }}</span></li>
      </sc-for>
    </ol>

    <section aria-label="Rama detectada" style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sub)">Rama</span>
      <div role="radiogroup" aria-label="Rama" style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{ ramas }}" as="r" hint-placeholder-count="6">
          <button role="radio" aria-checked="{{ r.on }}" onClick="{{ r.pick }}" style="{{ r.st }}">{{ r.name }}</button>
        </sc-for>
      </div>
      <span style="font-size: 12.5px; color: var(--sub)">{{ hint }}</span>
    </section>

    <section aria-label="JSON" style="display: flex; flex-direction: column; gap: 8px">
      <label for="json" style="font-family: 'Geist Mono', monospace; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sub)">JSON pegado</label>
      <pre id="json" style="margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); font-family: 'Geist Mono', monospace; font-size: 12px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere">{{ json }}</pre>
      <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--sa)">✓ formato válido · sesión del 14 dic</span>
    </section>

    <section aria-label="Qué cambia" style="display: flex; flex-direction: column">
      <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sub); padding-bottom: 8px; border-bottom: 1px solid var(--line)">Qué cambia</span>
      <sc-for list="{{ cambios }}" as="c" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line)">
          <span style="{{ c.sq }}"></span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><b style="font-size: 14px; font-weight: 600">{{ c.t }}</b><span style="font-size: 12.5px; line-height: 1.4; color: var(--sub)">{{ c.d }}</span></span>
        </div>
      </sc-for>
    </section>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <button style="min-height: 52px; border: 0; border-radius: 6px; background: var(--ink); color: var(--paper); font: 600 17px Geist, sans-serif">Importar a matemática</button>
      <a href="Hoy.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 17px; font-weight: 600">Cancelar</a>
    </div>
  </main>
  <nav aria-label="Secciones" style="border-top: 1px solid var(--line); background: var(--paper); padding: 10px 12px 14px">
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" aria-current="{{ n.cur }}" style="{{ n.st }}">
          <span style="{{ n.pill }}"><span style="{{ n.ico }}"></span></span>
          <span>{{ n.label }}</span>
          <sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 4px; left: calc(50% + 9px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: var(--ink); color: var(--paper); font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 600; display: grid; place-items: center">{{ n.badge }}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { rama: 'matematica' }; }
  base(active) {
    const T = { dark: { paper: '#0E0F10', ink: '#EDEDE8', sub: '#9A9D98', line: '#2C2E2D', soft: '#18191A', dot: 'rgba(237,237,232,0.08)', ing: '#6CC4EE', hx: '#B3A4FF', ec: '#FF9F62', sa: '#7FD69A', ru: '#FF8E8E', eco: '#F0D45C', idi: '#F49AC2', a: '38%' }, light: { paper: '#F2F3EF', ink: '#141515', sub: '#585C59', line: '#C9CCC6', soft: '#E7E9E4', dot: 'rgba(20,21,21,0.10)', ing: '#1C7FB0', hx: '#5F4BCF', ec: '#C2560F', sa: '#24854A', ru: '#C23A3A', eco: '#8A6C00', idi: '#B4316F', a: '60%' } };
    const L = this.props.theme === 'light';
    const t = L ? T.light : T.dark;
    let vars = '';
    for (const k in t) if (k !== 'a') vars += '--' + k + ':' + t[k] + ';';
    const D = T.dark;
    for (const k of ['ing', 'hx', 'ec', 'sa', 'ru', 'eco', 'idi']) vars += '--mk-' + k + ':color-mix(in srgb,' + D[k] + ' ' + t.a + ',transparent);';
    vars += '--mk-nav:color-mix(in srgb,#F0D45C ' + t.a + ',transparent);';
    const ICO = { Hoy: '<path d="M3 18.5h18M7 18.5a5 5 0 0 1 10 0M12 5v3.2M5 9.6l1.9 1.3M19 9.6l-1.9 1.3"/>', Estudio: '<path d="M12 6.8c-2.2-1.6-5.2-2-8-1.6v12.9c2.8-.4 5.8 0 8 1.6 2.2-1.6 5.2-2 8-1.6V5.2c-2.8-.4-5.8 0-8 1.6zM12 6.8v12.9"/>', Metas: '<path d="M5.5 21V3.5M5.5 4.5h12.5l-2.6 4 2.6 4H5.5"/>', Entreno: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>', Perfil: '<circle cx="12" cy="9.5" r="5.5"/><path d="M9 14.6 7.6 21l4.4-2.2 4.4 2.2-1.4-6.4"/>' };
    const mask = (p) => { const u = 'url(data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>') + ')'; return 'width:22px;height:22px;background:currentColor;-webkit-mask:' + u + ' center / 22px 22px no-repeat;mask:' + u + ' center / 22px 22px no-repeat'; };
    const nav = [['Hoy', 'Hoy.dc.html', ''], ['Estudio', 'Estudio.dc.html', '22'], ['Metas', 'Ruta.dc.html', ''], ['Entreno', 'Rutinas.dc.html', ''], ['Perfil', 'Logros.dc.html', '']].map(([label, href, badge]) => { const on = label === active; return { label, href, badge, hasBadge: !!badge && !on, cur: on ? 'page' : 'false', ico: mask(ICO[label]),
      st: 'position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;text-decoration:none;font-size:11.5px;letter-spacing:0.01em;color:' + (on ? 'var(--ink);font-weight:600' : 'var(--sub)'),
      pill: 'width:54px;height:32px;display:grid;place-items:center;' + (on ? 'background:var(--mk-nav);clip-path:polygon(9% 0,100% 0,91% 100%,0 100%)' : '') }; });
    return { vars, nav };
  }
  renderVals() {
    const { vars, nav } = this.base('Hoy');
    const pasos = [['1', 'Foto del cuaderno'], ['2', 'Claude corrige'], ['3', 'Pegás el JSON'], ['4', 'Trazo reparte']].map(([n, t], i) => ({ n, t, st: 'display:flex;flex-direction:column;gap:4px;padding:10px 8px;border-right:1px solid var(--line);border-bottom:' + (i === 2 ? '3px solid var(--ink)' : '1px solid var(--line)') }));
    const C = { matematica: 'eco', programacion: 'ing', ingles: 'idi', trabajo: 'ru', handyx: 'hx', salud: 'sa' };
    const HINT = { matematica: 'Sesión de estudio: tarjetas, errores, test y repasos.', programacion: 'Revisión de código o examen: errores por tipo y avance del proyecto.', ingles: 'Entrevista ensayada o simulacro: puntaje y fallas como tarjetas.', trabajo: 'Postulaciones y entrevistas: el embudo se actualiza solo.', handyx: 'Horas y operaciones de la semana.', salud: 'Va por Entreno y Peso; acá solo si traés medidas.' };
    const r = this.state.rama;
    const ramas = Object.keys(C).map((name) => { const on = name === r; return { name, on: on ? 'true' : 'false', pick: () => this.setState({ rama: name }),
      st: 'min-height:40px;padding:0 12px;border-radius:6px;cursor:pointer;font:500 12.5px Geist Mono,monospace;border:1.5px solid var(--' + C[name] + ');' + (on ? 'background:var(--mk-' + C[name] + ');color:var(--ink)' : 'background:transparent;color:var(--' + C[name] + ')') }; });
    const json = '{\n  "tipo": "sesion",\n  "rama": "matematica",\n  "fecha": "2026-12-14",\n  "libro": "CONAMAT · Aritmética",\n  "capitulo": 4,\n  "minutos": 120,\n  "test": { "hechos": 30, "correctos": 26 },\n  "errores": [\n    { "tema": "divisibilidad", "tipo": "concepto",\n      "nota": "criterio del 11" }\n  ],\n  "tarjetas_nuevas": 6\n}';
    const cambios = [['eco', 'Test del cap. 4 · 87 %', 'Aprobado: supera el corte de 85 %.'], ['eco', '+6 tarjetas', 'Repasos el 15, 17 y 21 dic, el 4 ene y el 12 feb.'], ['eco', 'Tesis del cap. 4 · 17 dic', 'Entra al repaso de ese día, después del cold recall.'], ['ru', '1 punto débil · divisibilidad', 'Tipo concepto. Se suma a Puntos débiles.'], ['ink', 'Ruta: Aritmética 4 de 11', 'La rama matemática avanza y el mapa marca el commit.']].map(([c, t, d]) => ({ t, d, sq: 'width:11px;height:11px;margin-top:4px;border-radius:2px;background:var(--' + c + ')' }));
    return { vars, nav, pasos, ramas, hint: HINT[r], json, cambios };
  }
}
</script>
</body>
</html>
